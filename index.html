<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo Quiz Game</title>
    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #f1f5f9, #e2e8f0, #cbd5e1);
        --container-bg: rgb(255, 255, 255);
        --container-border: rgba(255, 255, 255, 0.9);
        --text-color: #0f172a;
        --header-text: #475569;
        --badge-bg: rgba(255, 255, 255, 0.85);
        --badge-border: rgba(0, 0, 0, 0.08);
        --card-bg: rgba(255, 255, 255, 0.5);
        --card-border: rgba(255, 255, 255, 0.8);
        --grid-bg: #94a3b8;
        --tile-bg: #cbd5e1;
        --tile-border: rgba(255, 255, 255, 0.4);
        --logo-name-color: #0284c7;
        --btn-bg: rgba(255, 255, 255, 0.85);
        --btn-border: rgba(0, 0, 0, 0.1);
        --btn-text: #1e293b;
        --btn-hover: #ffffff;
        --shadow-color: rgba(0, 0, 0, 0.1);
        --kbd-bg: rgba(0, 0, 0, 0.06);
        --kbd-text: #64748b;
        --upload-border: #94a3b8;
      }

      body.dark-mode {
        --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b, #334155);
        --container-bg: rgba(15, 23, 42, 0.75);
        --container-border: rgba(255, 255, 255, 0.1);
        --text-color: #f8fafc;
        --header-text: #cbd5e1;
        --badge-bg: rgba(255, 255, 255, 0.1);
        --badge-border: rgba(255, 255, 255, 0.15);
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-border: rgba(255, 255, 255, 0.1);
        --grid-bg: #1e293b;
        --tile-bg: #1e293b;
        --tile-border: rgba(255, 255, 255, 0.05);
        --logo-name-color: #38bdf8;
        --btn-bg: rgba(255, 255, 255, 0.1);
        --btn-border: rgba(255, 255, 255, 0.15);
        --btn-text: #ffffff;
        --btn-hover: rgba(255, 255, 255, 0.2);
        --shadow-color: rgba(0, 0, 0, 0.5);
        --kbd-bg: rgba(255, 255, 255, 0.1);
        --kbd-text: #94a3b8;
        --upload-border: #475569;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        width: 100%;
        min-height: 100vh;
        background: var(--bg-gradient);
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      /* Glassmorphism Card Container */
      .container {
        position: relative;
        background: var(--container-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--container-border);
        border-radius: 24px;
        padding: 24px 28px;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 25px 50px -12px var(--shadow-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        overflow: hidden;
        transition:
          background 0.3s ease,
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      /* Countdown Screen Overlay */
      .countdown-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .countdown-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .countdown-text {
        font-size: 5.5rem;
        font-weight: 900;
        color: #38bdf8;
        text-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes popIn {
        0% {
          transform: scale(0.2);
          opacity: 0;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Upload Screen Styling */
      .upload-screen {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
      }

      .upload-box {
        width: 100%;
        border: 2px dashed var(--upload-border);
        border-radius: 16px;
        padding: 30px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .upload-box:hover {
        border-color: var(--logo-name-color);
        background: rgba(56, 189, 248, 0.05);
      }

      .upload-icon {
        font-size: 2.2rem;
      }

      #file-input {
        display: none;
      }

      /* Top Stats Bar */
      .header-bar {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        letter-spacing: 0.5px;
        color: var(--header-text);
        margin-bottom: 4rem;
      }

      .header-bar_2 {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 600;
        font-size: 0.9rem;
        letter-spacing: 0.5px;
        color: var(--header-text);
      }

      .badge {
        background: var(--badge-bg);
        padding: 6px 12px;
        border-radius: 20px;
        border: 1px solid var(--badge-border);
        transition:
          background 0.3s ease,
          border-color 0.3s ease;
      }

      /* Theme Toggle Button */
      .theme-btn {
        background: var(--badge-bg);
        border: 1px solid var(--badge-border);
        border-radius: 20px;
        padding: 6px 12px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        color: var(--header-text);
        display: flex;
        align-items: center;
        gap: 4px;
        transition: all 0.2s ease;
        flex: none;
      }

      .theme-btn:hover {
        transform: translateY(-1px);
        background: var(--btn-hover);
      }

      /* Game Screen Layout */
      .game-screen {
        width: 100%;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .game-screen.active {
        display: flex;
      }

      /* Image Wrapper & 15x15 Grid */
      .image-card {
        position: relative;
        width: 250px;
        height: 250px;
        border-radius: 20px;
        background: var(--card-bg);
        box-shadow:
          inset 0 0 15px rgba(0, 0, 0, 0.1),
          0 10px 25px var(--shadow-color);
        border: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .logo-img {
        width: 90%;
        height: 90%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
        border-radius: 0.5rem;
      }

      .grid-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: repeat(15, 1fr);
        grid-template-rows: repeat(15, 1fr);
        z-index: 10;
        pointer-events: none;
        background: var(--grid-bg);
      }

      .grid-tile {
        background: var(--tile-bg);
        border: 0.5px solid var(--tile-border);
        transform: scale(1);
        opacity: 1;
      }

      .grid-tile.animated {
        transition:
          transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.3s ease;
      }

      .grid-tile.hidden {
        opacity: 0;
        transform: scale(0.2);
      }

      /* Logo Name Label */
      .logo-name {
        min-height: 28px;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: var(--logo-name-color);
        text-transform: capitalize;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        text-align: center;
      }

      .logo-name.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Controls Layout */
      .controls-grid {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 4rem;
      }

      .btn-row {
        display: flex;
        gap: 10px;
        width: 100%;
      }

      button {
        flex: 1;
        padding: 10px 14px;
        border: none;
        border-radius: 12px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        color: var(--btn-text);
        background: var(--btn-bg);
        border: 1px solid var(--btn-border);
        transition: all 0.2s ease;
        backdrop-filter: blur(4px);
      }

      button:hover:not(:disabled) {
        background: var(--btn-hover);
        transform: translateY(-2px);
      }

      button:active:not(:disabled) {
        transform: translateY(0);
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-primary {
        background: linear-gradient(135deg, #0284c7, #2563eb);
        border: none;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }

      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #0369a1, #1d4ed8);
      }

      .btn-fastforward {
        background: linear-gradient(135deg, #e11d48, #be123c);
        border: none;
        color: #ffffff;
        box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
      }

      .btn-fastforward:hover:not(:disabled) {
        background: linear-gradient(135deg, #be123c, #9f1239);
      }

      .btn-active {
        background: rgba(56, 189, 248, 0.25);
        border-color: #38bdf8;
      }

      .shortcuts-hint {
        font-size: 0.75rem;
        color: var(--kbd-text);
        text-align: center;
      }

      kbd {
        background: var(--kbd-bg);
        padding: 2px 5px;
        border-radius: 4px;
        color: var(--kbd-text);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 3-2-1 Countdown Overlay -->
      <div id="countdown-overlay" class="countdown-overlay">
        <div id="countdown-text" class="countdown-text">3</div>
      </div>

      <!-- Header -->
      <div class="header-bar">
        <button id="btn-theme" class="theme-btn">☀️ Light</button>
        <button id="btn-test-audio" class="theme-btn">🔊 Test Sound</button>
        <span class="badge" id="score-text">Revealed: 0</span>
      </div>
      <div class="header-bar_2">
        <span class="badge" id="progress-text">0 / 0</span>
      </div>

      <!-- Upload View -->
      <div id="upload-screen" class="upload-screen">
        <h2>Upload Logo Images</h2>
        <p style="font-size: 0.85rem; color: var(--header-text)">
          Select multiple logo images from your device to create your custom
          quiz.
        </p>
        <label for="file-input" class="upload-box">
          <span class="upload-icon">📁</span>
          <span>Click to select or drag images here</span>
          <span style="font-size: 0.75rem; opacity: 0.7"
            >(PNG, JPG, SVG, WEBP)</span
          >
        </label>
        <input
          type="file"
          id="file-input"
          multiple
          accept="image/png, image/jpeg, image/webp, image/svg+xml"
        />
      </div>

      <!-- Game View -->
      <div id="game-screen" class="game-screen">
        <div class="image-card">
          <img id="logo-img" class="logo-img" src="" alt="Logo" />
          <div id="grid-overlay" class="grid-overlay"></div>
        </div>

        <div id="logo-name" class="logo-name"></div>

        <div class="controls-grid">
          <div class="btn-row">
            <button id="btn-reveal" class="btn-primary">
              Reveal Image (Space)
            </button>
            <button
              id="btn-fastforward"
              class="btn-fastforward"
              style="display: none"
            >
              Fast Forward ⏭
            </button>
          </div>

          <div class="btn-row">
            <button id="btn-prev">← Prev</button>
            <button id="btn-next">Next →</button>
          </div>

          <div class="btn-row">
            <button id="btn-shuffle">Shuffle</button>
            <button id="btn-restart">Restart / Change</button>
          </div>
        </div>

        <div class="shortcuts-hint">
          Shortcuts: <kbd>Space</kbd> Reveal / Fast Forward | <kbd>←</kbd>
          <kbd>→</kbd> Navigate
        </div>
      </div>
    </div>

    <script>
      const GRID_SIZE = 15;
      const TOTAL_TILES = GRID_SIZE * GRID_SIZE;

      // State Management
      let uploadedImages = []; // Stores objects { name: string, src: string }
      let currentPlaylist = [];
      let currentIndex = 0;
      let revealedCount = 0;
      let isRevealed = false;
      let isAnimating = false;
      let animRequestFrame = null;
      let isShuffleMode = false;
      let isDarkMode = false;

      // Audio State
      let audioCtx = null;
      let lastTickTime = 0;

      // Animation tracking
      let tilesArray = [];
      let randomizedIndices = [];
      let currentTileIndex = 0;
      let lastTileTime = 0;
      const TIME_PER_TILE = 16;

      // DOM Elements
      const uploadScreen = document.getElementById("upload-screen");
      const gameScreen = document.getElementById("game-screen");
      const fileInput = document.getElementById("file-input");
      const logoImg = document.getElementById("logo-img");
      const gridOverlay = document.getElementById("grid-overlay");
      const logoNameEl = document.getElementById("logo-name");
      const progressEl = document.getElementById("progress-text");
      const scoreEl = document.getElementById("score-text");
      const btnReveal = document.getElementById("btn-reveal");
      const btnFastForward = document.getElementById("btn-fastforward");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");
      const btnShuffle = document.getElementById("btn-shuffle");
      const btnRestart = document.getElementById("btn-restart");
      const btnTheme = document.getElementById("btn-theme");
      const btnTestAudio = document.getElementById("btn-test-audio");
      const countdownOverlay = document.getElementById("countdown-overlay");
      const countdownText = document.getElementById("countdown-text");

      // Audio Helper - ensures AudioContext is resumed on user gesture
      async function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state !== "running") {
          await audioCtx.resume();
        }
      }

      // Audio: Standalone verification beep
      async function testAudio() {
        await initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.value = 600;
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }

      // Audio: Countdown SFX
      async function playCountdownBeep(isGo = false) {
        await initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        // Frequency is 440Hz for "3, 2, 1" and higher pitch 880Hz for "GO!"
        osc.frequency.value = isGo ? 880 : 440;

        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioCtx.currentTime + (isGo ? 0.35 : 0.18),
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + (isGo ? 0.35 : 0.18));
      }

      // Countdown Sequence at start of game
      async function runCountdown() {
        countdownOverlay.classList.add("active");
        const steps = ["3", "2", "1", "GO!"];

        for (let i = 0; i < steps.length; i++) {
          const step = steps[i];
          const isGo = step === "GO!";

          countdownText.textContent = step;
          countdownText.style.animation = "none";
          void countdownText.offsetWidth; // Trigger reflow for animation restart
          countdownText.style.animation =
            "popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)";

          playCountdownBeep(isGo);

          await new Promise((resolve) => setTimeout(resolve, isGo ? 500 : 700));
        }

        countdownOverlay.classList.remove("active");
      }

      // Audio: Softer, dramatic pop/tink sound with rate throttling
      function playTick() {
        if (!audioCtx || audioCtx.state !== "running") return;

        const now = performance.now();
        // Throttle to avoid audio processing clutter
        if (now - lastTickTime < 28) return;
        lastTickTime = now;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        // Dramatic soft pitch decay from base frequency down
        const baseFreq = 400 + (currentTileIndex / TOTAL_TILES) * 550;
        osc.type = "sine";
        osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(
          baseFreq * 0.45,
          audioCtx.currentTime + 0.025,
        );

        // Softened volume down to 0.035 for a subtle dramatic sound
        gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioCtx.currentTime + 0.025,
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.025);
      }

      // Audio: Card Swoosh Transition Sound
      async function playSwoosh() {
        await initAudio();
        if (!audioCtx) return;

        const bufferSize = audioCtx.sampleRate * 0.15; // 150ms noise
        const buffer = audioCtx.createBuffer(
          1,
          bufferSize,
          audioCtx.sampleRate,
        );
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.value = 1.5;

        // Sweep filter cutoff to produce a wind/swoosh effect
        filter.frequency.setValueAtTime(300, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(
          1800,
          audioCtx.currentTime + 0.08,
        );
        filter.frequency.exponentialRampToValueAtTime(
          200,
          audioCtx.currentTime + 0.15,
        );

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.06);
        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioCtx.currentTime + 0.15,
        );

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
      }

      function buildGrid() {
        gridOverlay.innerHTML = "";
        for (let i = 0; i < TOTAL_TILES; i++) {
          const tile = document.createElement("div");
          tile.classList.add("grid-tile");
          gridOverlay.appendChild(tile);
        }
        tilesArray = Array.from(gridOverlay.children);
      }

      function formatLogoName(filename) {
        return filename.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");
      }

      async function handleFiles(files) {
        const imageFiles = Array.from(files).filter((file) =>
          file.type.startsWith("image/"),
        );

        if (imageFiles.length === 0) return;

        uploadedImages = imageFiles.map((file) => ({
          name: formatLogoName(file.name),
          src: URL.createObjectURL(file),
        }));

        currentPlaylist = [...uploadedImages];
        currentIndex = 0;
        revealedCount = 0;

        uploadScreen.style.display = "none";
        gameScreen.classList.add("active");

        buildGrid();
        loadCurrentSlide();

        // Run the 3-2-1 countdown overlay only at the initial start of the game
        await runCountdown();
      }

      function loadCurrentSlide() {
        if (animRequestFrame) cancelAnimationFrame(animRequestFrame);
        isAnimating = false;
        isRevealed = false;

        gridOverlay.style.background = "var(--grid-bg)";
        for (let tile of tilesArray) {
          tile.classList.remove("animated", "hidden");
        }

        const currentItem = currentPlaylist[currentIndex];
        logoImg.src = currentItem.src;

        logoNameEl.classList.remove("visible");
        logoNameEl.textContent = "";

        btnReveal.style.display = "block";
        btnReveal.disabled = false;
        btnFastForward.style.display = "none";

        progressEl.textContent = `${currentIndex + 1} / ${currentPlaylist.length}`;
        scoreEl.textContent = `Revealed: ${revealedCount}`;
      }

      function animateTiles(timestamp) {
        if (!isAnimating) return;

        if (!lastTileTime) lastTileTime = timestamp;
        const elapsed = timestamp - lastTileTime;

        if (elapsed >= TIME_PER_TILE) {
          const tilesToDrop = Math.floor(elapsed / TIME_PER_TILE);
          for (let i = 0; i < tilesToDrop; i++) {
            if (currentTileIndex < TOTAL_TILES) {
              const tileIdx = randomizedIndices[currentTileIndex];
              tilesArray[tileIdx].classList.add("hidden");
              currentTileIndex++;
              playTick();
            }
          }
          lastTileTime = timestamp;
        }

        if (currentTileIndex < TOTAL_TILES) {
          animRequestFrame = requestAnimationFrame(animateTiles);
        } else {
          finishReveal();
        }
      }

      async function startReveal() {
        if (isRevealed || isAnimating) return;

        await initAudio();
        isAnimating = true;

        gridOverlay.style.background = "transparent";

        for (let tile of tilesArray) {
          tile.classList.add("animated");
        }

        btnReveal.style.display = "none";
        btnFastForward.style.display = "block";

        randomizedIndices = Array.from({ length: TOTAL_TILES }, (_, i) => i);
        for (let i = randomizedIndices.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [randomizedIndices[i], randomizedIndices[j]] = [
            randomizedIndices[j],
            randomizedIndices[i],
          ];
        }

        currentTileIndex = 0;
        lastTileTime = 0;
        animRequestFrame = requestAnimationFrame(animateTiles);
      }

      function fastForwardReveal() {
        if (!isAnimating && isRevealed) return;

        if (animRequestFrame) cancelAnimationFrame(animRequestFrame);

        gridOverlay.style.background = "transparent";
        for (let i = 0; i < TOTAL_TILES; i++) {
          tilesArray[i].classList.add("animated", "hidden");
        }

        finishReveal();
      }

      function finishReveal() {
        isAnimating = false;
        isRevealed = true;

        btnFastForward.style.display = "none";
        btnReveal.style.display = "block";
        btnReveal.disabled = true;

        logoNameEl.textContent = currentPlaylist[currentIndex].name;
        logoNameEl.classList.add("visible");

        revealedCount++;
        scoreEl.textContent = `Revealed: ${revealedCount}`;
      }

      function nextSlide() {
        if (currentIndex < currentPlaylist.length - 1) {
          playSwoosh();
          currentIndex++;
          loadCurrentSlide();
        }
      }

      function prevSlide() {
        if (currentIndex > 0) {
          playSwoosh();
          currentIndex--;
          loadCurrentSlide();
        }
      }

      function toggleShuffle() {
        playSwoosh();
        isShuffleMode = !isShuffleMode;
        btnShuffle.classList.toggle("btn-active", isShuffleMode);

        if (isShuffleMode) {
          for (let i = currentPlaylist.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [currentPlaylist[i], currentPlaylist[j]] = [
              currentPlaylist[j],
              currentPlaylist[i],
            ];
          }
        } else {
          currentPlaylist = [...uploadedImages];
        }

        currentIndex = 0;
        loadCurrentSlide();
      }

      function restartQuiz() {
        if (confirm("Do you want to upload new images?")) {
          gameScreen.classList.remove("active");
          uploadScreen.style.display = "flex";
          fileInput.value = "";
          uploadedImages = [];
          progressEl.textContent = "0 / 0";
          scoreEl.textContent = "Revealed: 0";
        } else {
          playSwoosh();
          currentIndex = 0;
          revealedCount = 0;
          if (isShuffleMode) {
            toggleShuffle();
          } else {
            loadCurrentSlide();
          }
        }
      }

      function toggleTheme() {
        isDarkMode = !isDarkMode;
        document.body.classList.toggle("dark-mode", isDarkMode);
        btnTheme.textContent = isDarkMode ? "🌙 Dark" : "☀️ Light";

        if (!isAnimating && !isRevealed) {
          gridOverlay.style.background = "var(--grid-bg)";
        }
      }

      // Event Listeners
      fileInput.addEventListener("change", (e) => handleFiles(e.target.files));

      btnReveal.addEventListener("click", startReveal);
      btnFastForward.addEventListener("click", fastForwardReveal);
      btnNext.addEventListener("click", nextSlide);
      btnPrev.addEventListener("click", prevSlide);
      btnShuffle.addEventListener("click", toggleShuffle);
      btnRestart.addEventListener("click", restartQuiz);
      btnTheme.addEventListener("click", toggleTheme);
      btnTestAudio.addEventListener("click", testAudio);

      // Drag and Drop implementation
      const uploadBox = document.querySelector(".upload-box");
      uploadBox.addEventListener("dragover", (e) => e.preventDefault());
      uploadBox.addEventListener("drop", (e) => {
        e.preventDefault();
        handleFiles(e.dataTransfer.files);
      });

      // Keyboard Shortcuts
      document.addEventListener("keydown", (e) => {
        if (!gameScreen.classList.contains("active")) return;

        if (e.code === "Space") {
          e.preventDefault();
          if (isAnimating) {
            fastForwardReveal();
          } else {
            startReveal();
          }
        } else if (e.code === "ArrowRight") {
          nextSlide();
        } else if (e.code === "ArrowLeft") {
          prevSlide();
        }
      });
    </script>
  </body>
</html>
